<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TactiVision | Login</title>
<link rel="stylesheet" href="/frontend/estilo.css">
</head>
<body class="pagina-autenticacao">
<main class="cartao-autenticacao">
<div class="marca">Tacti<span>Vision</span></div>
<p class="subtitulo">Inteligência Artificial para Análise Tática Esportiva</p>
<form id="form-login">
<label>E-mail<input type="email" id="email" required></label>
<label>Senha<input type="password" id="senha" required></label>
<button type="submit">Entrar</button>
<p id="mensagem" class="mensagem"></p>
</form>
<a href="/frontend/cadastro.html">Criar conta</a>
</main>
<script src="/frontend/script.js"></script>
<script>
document.getElementById("form-login").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const resposta = await api("/login", {
        method: "POST",
        body: JSON.stringify({email: document.getElementById("email").value, senha: document.getElementById("senha").value})
    });
    const mensagem = document.getElementById("mensagem");
    if (resposta.ok) location.href = "/frontend/dashboard.html";
    else mensagem.textContent = resposta.data.detail || "Não foi possível entrar.";
});
</script>
</body>
</html>
